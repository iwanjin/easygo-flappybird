<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>플래피버드 진단</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #f0f0f0;
    }
    .diagnostic {
      background: white;
      padding: 20px;
      margin: 10px 0;
      border-radius: 5px;
      border-left: 4px solid #007bff;
    }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 3px;
    }
    pre {
      background: #f9f9f9;
      padding: 10px;
      overflow-x: auto;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

<h1>🔍 플래피버드 진단 도구</h1>

<div class="diagnostic">
  <h2>1️⃣ 모듈 로드 확인</h2>
  <button onclick="checkModules()">모듈 확인</button>
  <pre id="modules-result"></pre>
</div>

<div class="diagnostic">
  <h2>2️⃣ Canvas 상태 확인</h2>
  <button onclick="checkCanvas()">Canvas 확인</button>
  <pre id="canvas-result"></pre>
</div>

<div class="diagnostic">
  <h2>3️⃣ Game 객체 메서드 확인</h2>
  <button onclick="checkGameMethods()">Game 메서드 확인</button>
  <pre id="game-result"></pre>
</div>

<div class="diagnostic">
  <h2>4️⃣ 콘솔 에러 캡처</h2>
  <button onclick="captureErrors()">에러 캡처</button>
  <pre id="errors-result"></pre>
</div>

<div class="diagnostic">
  <h2>5️⃣ 수동 게임 테스트</h2>
  <button onclick="manualGameTest()">게임 시작 (Easy)</button>
  <button onclick="testJump()">점프 테스트</button>
  <pre id="test-result"></pre>
</div>

<script>
const log = (text) => {
  console.log(text);
  return text;
};

function checkModules() {
  const result = document.getElementById('modules-result');
  let output = '';

  const modules = ['Storage', 'Sound', 'Renderer', 'Theme', 'UI', 'Game', 'Confetti'];

  modules.forEach(name => {
    const exists = typeof window[name] !== 'undefined';
    const status = exists ? '<span class="pass">✅</span>' : '<span class="fail">❌</span>';
    output += `${status} ${name}\n`;
  });

  result.innerHTML = output;
}

function checkCanvas() {
  const result = document.getElementById('canvas-result');
  let output = '';

  const canvas = document.getElementById('gameCanvas');
  output += `Canvas 요소: ${canvas ? '<span class="pass">✅ 찾음</span>' : '<span class="fail">❌ 없음</span>'}\n`;

  if (canvas) {
    output += `렌더링 크기: ${canvas.width}x${canvas.height}\n`;
    output += `표시 크기: ${canvas.offsetWidth}x${canvas.offsetHeight}px\n`;
    const ctx = canvas.getContext('2d');
    output += `Context: ${ctx ? '<span class="pass">✅</span>' : '<span class="fail">❌</span>'}\n`;
  }

  result.innerHTML = output;
}

function checkGameMethods() {
  const result = document.getElementById('game-result');
  let output = '';

  if (typeof Game === 'undefined') {
    result.innerHTML = '<span class="fail">❌ Game 모듈을 찾을 수 없습니다</span>';
    return;
  }

  const methods = ['init', 'start', 'jump', 'reset', 'getState'];

  methods.forEach(name => {
    const exists = typeof Game[name] === 'function';
    const status = exists ? '<span class="pass">✅</span>' : '<span class="fail">❌</span>';
    output += `${status} Game.${name}\n`;
  });

  result.innerHTML = output;
}

let errorList = [];
function captureErrors() {
  const result = document.getElementById('errors-result');

  // 콘솔 에러 캡처
  const originalError = console.error;
  console.error = function(...args) {
    errorList.push('ERROR: ' + args.join(' '));
    originalError.apply(console, args);
  };

  // 콘솔 로그도 캡처
  const originalLog = console.log;
  console.log = function(...args) {
    // Game 관련 로그만 캡처
    if (String(args[0]).includes('Game') || String(args[0]).includes('모듈')) {
      errorList.push('LOG: ' + args.join(' '));
    }
    originalLog.apply(console, args);
  };

  result.innerHTML = errorList.length > 0
    ? errorList.join('\n')
    : '에러 없음 ✅';
}

function manualGameTest() {
  const result = document.getElementById('test-result');
  let output = '';

  try {
    output += '1. Game.init(\'easy\', 0) 호출...\n';
    Game.init('easy', 0);
    output += '<span class="pass">✅ 초기화 성공</span>\n\n';

    const state1 = Game.getState();
    output += `상태: ${JSON.stringify(state1)}\n\n`;

    output += '2. Game.start() 호출...\n';
    Game.start();
    output += '<span class="pass">✅ 게임 시작</span>\n\n';

    const state2 = Game.getState();
    output += `상태: ${JSON.stringify(state2)}\n\n`;

    output += '⏳ 2초 후 게임 화면을 보세요.\n';
    output += '새가 부드럽게 떨어져야 합니다.\n';

  } catch (e) {
    output += `<span class="fail">❌ 에러: ${e.message}</span>`;
  }

  result.innerHTML = output;
}

function testJump() {
  const result = document.getElementById('test-result');
  let output = '';

  try {
    output += 'Game.jump() 호출...\n';
    Game.jump();
    output += '<span class="pass">✅ 점프 호출 성공</span>\n\n';

    const state = Game.getState();
    output += `현재 상태: ${JSON.stringify(state)}\n`;

  } catch (e) {
    output += `<span class="fail">❌ 에러: ${e.message}</span>`;
  }

  result.innerHTML = output;
}

// 페이지 로드 시 자동 확인
window.addEventListener('load', () => {
  console.log('진단 페이지 로드 완료');
  checkModules();
});
</script>

</body>
</html>
